<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=630">
    <title>Ripple OG Image</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
        }
        body {
            background: #0d1117;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            position: relative;
        }
        /* Subtle grid background */
        .grid-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        /* Glow */
        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
        }
        .glow-blue {
            background: #3b82f6;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
        }
        .glow-purple {
            background: #8b5cf6;
            bottom: -150px;
            right: 100px;
            opacity: 0.08;
        }
        /* Content */
        .card {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px 80px;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(20px);
            max-width: 900px;
        }
        .title {
            font-size: 3.5rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }
        .title .emoji {
            font-size: 3rem;
            margin-right: 12px;
        }
        .subtitle {
            font-size: 1.5rem;
            color: #9ca3af;
            margin-bottom: 32px;
            line-height: 1.4;
        }
        .stats {
            font-size: 1.3rem;
            color: #3b82f6;
            font-weight: 600;
            margin-bottom: 32px;
            letter-spacing: 0.5px;
        }
        .url {
            font-size: 0.95rem;
            color: #6b7280;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="glow glow-blue"></div>
    <div class="glow glow-purple"></div>
    <div class="card">
        <div class="title"><span class="emoji">🌊</span>Ripple</div>
        <div class="subtitle">Auto-fixes downstream code when APIs change</div>
        <div class="stats">12 languages · 7 platforms · 15 seconds</div>
        <div class="url">ripple-cnn.pages.dev</div>
    </div>
</body>
</html>
