<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>PropBench — Human Baseline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        header p { color: #64748b; }

        .progress-fill { height: 100%; background: #3b82f6; border-radius: 3px; transition: width 0.3s; }
        .progress-text { font-size: 0.85rem; color: #64748b; white-space: nowrap; }
        
        .card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 28px; margin-bottom: 20px; }
        .card h2 { font-size: 1.1rem; margin-bottom: 12px; color: #1e293b; }
        .card h3 { font-size: 0.95rem; margin-bottom: 8px; color: #475569; }
        
        .trigger { border-left: 4px solid #3b82f6; padding-left: 16px; margin: 16px 0; }
        .trigger .package { font-weight: 700; font-size: 1.05rem; color: #1e40af; }
        .trigger .files { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #475569; margin: 8px 0; }
        .trigger .files code { background: #f1f5f9; padding: 2px 6px; border-radius: 3px; display: block; margin: 4px 0; }
        .trigger .intent { font-style: italic; color: #64748b; margin-top: 8px; }
        
        .prediction-area { margin-top: 20px; }
        .prediction-area label { font-weight: 600; display: block; margin-bottom: 8px; }
        .prediction-area .help { font-size: 0.85rem; color: #64748b; margin-bottom: 12px; }
        
        .prediction-input { display: flex; gap: 8px; margin-bottom: 12px; }
        .prediction-input input { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.95rem; }
        .prediction-input input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .prediction-input button { padding: 10px 16px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .prediction-input button:hover { background: #2563eb; }
        
        .predictions-list { list-style: none; margin: 12px 0; }
        .predictions-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #f8fafc; border-radius: 6px; margin-bottom: 6px; font-family: monospace; font-size: 0.9rem; }
        .predictions-list li .remove { color: #ef4444; cursor: pointer; font-weight: 700; padding: 0 4px; }
        
        .confidence-select { margin-top: 12px; }
        .confidence-select label { font-size: 0.9rem; color: #475569; }
        .confidence-select select { padding: 6px 12px; border-radius: 6px; border: 1px solid #d1d5db; }
        
        .actions { display: flex; gap: 12px; margin-top: 24px; }
        .btn { padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-size: 1rem; transition: all 0.2s; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
        .btn-secondary { background: white; color: #475569; border: 1px solid #d1d5db; }
        .btn-secondary:hover { background: #f8fafc; }
        .btn-skip { background: #f1f5f9; color: #64748b; }
        
        .results { margin-top: 20px; padding: 20px; border-radius: 8px; }
        .results.correct { background: #f0fdf4; border: 1px solid #86efac; }
        .results.partial { background: #fffbeb; border: 1px solid #fcd34d; }
        .results.missed { background: #fef2f2; border: 1px solid #fca5a5; }
        .results h3 { margin-bottom: 8px; }
        .results .score { font-size: 1.5rem; font-weight: 700; }
        .results ul { margin-top: 8px; padding-left: 20px; }
        .results li { margin: 4px 0; font-size: 0.9rem; }
        .results .hit { color: #16a34a; }
        .results .miss { color: #dc2626; }
        .results .extra { color: #d97706; }
        
        .summary { text-align: center; padding: 40px; }
        .summary h2 { margin-bottom: 16px; }
        .summary .final-score { font-size: 3rem; font-weight: 800; color: #3b82f6; }
        .summary .breakdown { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .summary .stat { padding: 16px; background: #f8fafc; border-radius: 8px; }
        .summary .stat-value { font-size: 1.5rem; font-weight: 700; }
        .summary .stat-label { font-size: 0.8rem; color: #64748b; }
        
        .hidden { display: none; }
    </style>
</head>

// === RANDOMIZATION ===
// Each participant gets 5 random challenges from the pool (shuffled)
const CHALLENGES_PER_SESSION = 5;
let activeChallenges = [];

function shuffleArray(arr) {
    const shuffled = [...arr];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

function selectChallenges() {
    // Shuffle all challenges and pick N
    const shuffled = shuffleArray(CHALLENGES);
    activeChallenges = shuffled.slice(0, CHALLENGES_PER_SESSION);
}

// Initialize on load
selectChallenges();

let currentIndex = 0;
let userPredictions = [];
let results = [];
let sessionId = `human-${Date.now()}`;
let participant = { name: '', role: '', yearsExp: '' };

    if (!started) {
        renderRegistration(app);
        return;

        return;

    const challenge = activeChallenges[currentIndex];

        </div>
        
        <div class="card">
            <h2>Challenge: ${challenge.title}</h2>

            <div class="trigger">
                <div class="package">${challenge.trigger.package}</div>
                <div class="files">
                    ${challenge.trigger.files.map(f => `<code>${f}</code>`).join('')}
                </div>
                <div class="intent">"${challenge.trigger.intent}"</div>
                <p style="margin-top: 8px; font-size: 0.9rem; color: #334155;">${challenge.trigger.diff_summary}</p>
            </div>
        </div>
        
        <div class="card">
            <div class="prediction-area">
                <label>Which of these consumers will BREAK because of this change?</label>
                <p class="help">Select all that need updating. Some are affected, some are not.</p>
                
                <div id="choices-list" style="margin: 16px 0;">
                    ${(challenge.choices || challenge.consequences.concat(challenge.distractors || []).sort(() => Math.random() - 0.5)).map((c, i) => ` 
                        <label style="display: flex; align-items: flex-start; gap: 10px; padding: 12px; margin-bottom: 8px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: all 0.15s;" onmouseover="this.style.borderColor='#3b82f6'" onmouseout="this.style.borderColor='#e2e8f0'">
                            <input type="checkbox" class="choice-cb" value="${c.package}" style="margin-top: 3px; width: 18px; height: 18px;">
                            <div>
                                <strong>${c.package}</strong>
                                <div style="font-size: 0.85rem; color: #64748b;">${c.description || c.hint || ''}</div>
                            </div>
                        </label>
                    `).join('')}
                </div>
                
                <div class="confidence-select">
                    <label>How confident are you overall?</label>
                    <select id="confidence">
                        <option value="high">High — I've done this before, I know what breaks</option>
                        <option value="medium" selected>Medium — Educated guess based on experience</option>
                        <option value="low">Low — Guessing, not sure what's downstream</option>
                    </select>
                </div>
            </div>
            
            <div class="actions">
                <button class="btn btn-primary" onclick="submit()">Submit Prediction</button>
                <button class="btn btn-skip" onclick="skip()">Skip (don't know)</button>
            </div>
            
            <div id="results-area" class="hidden"></div>
        </div>
    `;
    
    document.getElementById('pred-input').focus();
}

function addPrediction() {
    const input = document.getElementById('pred-input');
    const value = input.value.trim();
    if (!value) return;
    
    userPredictions.push(value);
    input.value = '';
    input.focus();
    
    const list = document.getElementById('predictions-list');
    list.innerHTML = userPredictions.map((p, i) => 
        `<li>${p} <span class="remove" onclick="removePrediction(${i})">×</span></li>`
    ).join('');
}

function removePrediction(index) {
    userPredictions.splice(index, 1);
    const list = document.getElementById('predictions-list');
    list.innerHTML = userPredictions.map((p, i) => 
        `<li>${p} <span class="remove" onclick="removePrediction(${i})">×</span></li>`
    ).join('');
}

function submit() {
    const challenge = activeChallenges[currentIndex];
    const confidence = document.getElementById('confidence').value;
    
    // Read selected checkboxes
    const checkboxes = document.querySelectorAll('.choice-cb:checked');
    userPredictions = Array.from(checkboxes).map(cb => cb.value);
    
    // Score: compare predictions to ground truth
    const actualPackages = challenge.consequences.map(c => c.package.toLowerCase());
    const predictedPackages = userPredictions.map(p => p.toLowerCase());
    
    const hits = predictedPackages.filter(p => actualPackages.some(a => a.includes(p) || p.includes(a)));
    const misses = actualPackages.filter(a => !predictedPackages.some(p => a.includes(p) || p.includes(a)));
    const extras = predictedPackages.filter(p => !actualPackages.some(a => a.includes(p) || p.includes(a)));
    
    const precision = predictedPackages.length > 0 ? hits.length / predictedPackages.length : 0;
    const recall = actualPackages.length > 0 ? hits.length / actualPackages.length : 0;
    const f1 = (precision + recall) > 0 ? 2 * (precision * recall) / (precision + recall) : 0;
    
    const result = {
        challenge_id: challenge.id,
        predictions: [...userPredictions],
        confidence,
        hits: hits.length,
        misses: misses.length,
        extras: extras.length,
        precision,
        recall,
        f1,
        actual: challenge.consequences,
    };
    results.push(result);
    
    // Show results
    const cls = recall >= 0.8 ? 'correct' : recall >= 0.4 ? 'partial' : 'missed';
    const area = document.getElementById('results-area');
    area.className = `results ${cls}`;
    area.innerHTML = `
        <h3>${recall >= 0.8 ? '🎉 Great!' : recall >= 0.4 ? '🤔 Partial' : '❌ Missed some'}</h3>
        <div class="score">Recall: ${(recall * 100).toFixed(0)}% | Precision: ${(precision * 100).toFixed(0)}%</div>
        <ul>
            ${hits.map(h => `<li class="hit">✅ ${h} — correct!</li>`).join('')}
            ${misses.map(m => `<li class="miss">❌ Missed: ${m}</li>`).join('')}
            ${extras.map(e => `<li class="extra">⚠️ Extra: ${e} (not in ground truth)</li>`).join('')}
        </ul>
        <p style="margin-top: 12px; font-size: 0.9rem; color: #475569;"><b>Actual consequences:</b></p>
        <ul>${challenge.consequences.map(c => `<li>${c.package}: ${c.description}</li>`).join('')}</ul>
        <button class="btn btn-primary" style="margin-top: 16px;" onclick="next()">Next Challenge →</button>
    `;
    area.classList.remove('hidden');
    
    // Hide submit buttons
    document.querySelector('.actions').classList.add('hidden');
}

function skip() {
    results.push({ challenge_id: CHALLENGES[currentIndex].id, skipped: true });
    next();
}

function next() {
    currentIndex++;
    userPredictions = [];
    render();
}

function renderRegistration(app) {
    app.innerHTML = `
        <div class="card" style="max-width: 500px; margin: 0 auto;">
            <h2 style="margin-bottom: 16px;">👋 Before we start</h2>
            <p style="color: #64748b; margin-bottom: 20px;">Takes ~5 minutes. You'll see 5 code changes and predict what else needs updating.</p>
            
            <div style="margin-bottom: 16px;">
                <label style="font-weight: 600; display: block; margin-bottom: 4px;">Name or alias</label>
                <input type="text" id="reg-name" placeholder="e.g. Aakash" style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.95rem;">
            </div>
            
            <div style="margin-bottom: 16px;">
                <label style="font-weight: 600; display: block; margin-bottom: 4px;">Role</label>
                <select id="reg-role" style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.95rem;">
                    <option value="sde1">SDE I (0-2 years)</option>
                    <option value="sde2" selected>SDE II (2-5 years)</option>
                    <option value="sde3">Senior SDE (5-8 years)</option>
                    <option value="principal">Principal+ (8+ years)</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <div style="margin-bottom: 16px;">
                <label style="font-weight: 600; display: block; margin-bottom: 4px;">How many repos do you work with regularly?</label>
                <select id="reg-repos" style="width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.95rem;">
                    <option value="1-3">1-3 repos</option>
                    <option value="4-10" selected>4-10 repos</option>
                    <option value="10-20">10-20 repos</option>
                    <option value="20+">20+ repos</option>
                </select>
            </div>
            
            <button class="btn btn-primary" style="width: 100%;" onclick="startChallenge()">Start Challenge →</button>
            
            <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 16px; text-align: center;">Your predictions are anonymous. Results are used for research on engineering judgment.</p>
        </div>
    `;
}

function startChallenge() {
    const name = document.getElementById('reg-name').value.trim() || 'anonymous';
    const role = document.getElementById('reg-role').value;
    const repos = document.getElementById('reg-repos').value;
    
    participant = { name, role, repos };
    sessionId = `${name.toLowerCase().replace(/\s+/g, '-')}-${Date.now()}`;
    started = true;
    render();
}

function renderSummary(app) {
    // Auto-submit results to server (zero friction for participants)
    autoSubmitResults();
    
    const completed = results.filter(r => !r.skipped);
    const avgRecall = completed.length > 0 ? completed.reduce((s, r) => s + r.recall, 0) / completed.length : 0;
    const avgPrecision = completed.length > 0 ? completed.reduce((s, r) => s + r.precision, 0) / completed.length : 0;
    const avgF1 = completed.length > 0 ? completed.reduce((s, r) => s + r.f1, 0) / completed.length : 0;
    
    app.innerHTML = `
        <div class="card summary">
            <h2>🏁 Session Complete!</h2>
            <div class="final-score">${(avgF1 * 100).toFixed(0)}% F1</div>
            <p style="color: #64748b;">Average across ${completed.length} challenges</p>
            
            <div class="breakdown">
                <div class="stat"><div class="stat-value">${(avgRecall * 100).toFixed(0)}%</div><div class="stat-label">Recall</div></div>
                <div class="stat"><div class="stat-value">${(avgPrecision * 100).toFixed(0)}%</div><div class="stat-label">Precision</div></div>
                <div class="stat"><div class="stat-value">${results.filter(r => r.skipped).length}</div><div class="stat-label">Skipped</div></div>
            </div>
            
            <p style="margin-top: 24px; font-size: 0.9rem; color: #64748b;">
                This establishes your human baseline. For comparison:<br>
                FilePredictor (grep): 8% recall<br>
                Historian (co-change): 25% recall<br>
                Pattern + Structure: 82% recall<br>
                <b>You: ${(avgRecall * 100).toFixed(0)}% recall</b>
            </p>
            
            <button class="btn btn-primary" style="margin-top: 20px;" onclick="downloadResults()">Download Results (JSON)</button>
        </div>
    `;
}

function downloadResults() {
    const data = { 
        session_id: sessionId, 
        timestamp: new Date().toISOString(), 
        participant,
        results 
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `propbench-human-${sessionId}.json`;
    a.click();
}

// Auto-submit results to server when challenges complete
function autoSubmitResults() {
    const data = { 
        session_id: sessionId, 
        timestamp: new Date().toISOString(), 
        participant,
        results 
    };
    fetch('https://ripple-production-be7f.up.railway.app/propbench/submit', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    }).then(r => r.json()).then(d => {
        console.log('Results submitted:', d);
    }).catch(e => {
        console.log('Auto-submit failed (offline?):', e);
    });
}

// Start
render();
</script>
