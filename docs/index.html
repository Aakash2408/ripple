<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ripple Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="Ripple - Self-maintaining APIs">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Ripple Docs',
      repo: 'https://github.com/Aakash2408/ripple',
      loadSidebar: true,
      subMaxLevel: 3,
      search: {
        placeholder: 'Search docs...',
        noData: 'No results',
        depth: 3
      },
      auto2top: true
    }
  </script>
  <script src="https://unpkg.com/docsify@4/lib/docsify.min.js"></script>
  <script src="https://unpkg.com/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://unpkg.com/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://unpkg.com/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://unpkg.com/prismjs@1/components/prism-python.min.js"></script>
</body>
</html>
