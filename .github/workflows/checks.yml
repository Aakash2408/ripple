name: checks

# Every fix from 2026-08-16 is pinned by a test in tests/test_regression.py.
# Without CI those tests only run when someone remembers to invoke them, so
# nothing prevents a regression -- which matters here because most of the
# bugs were SILENT (a value computed then discarded, a function defined and
# never called) and would not surface until a customer noticed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches the Railway runtime

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          # app/webhook.py imports fastapi at module level, and 5 tests
          # import app.webhook, so fastapi+pydantic are REQUIRED here. My
          # first version of this file omitted them on the assumption that
          # the tests only needed stdlib -- CI failed on its first run with
          # 46/51 and five ModuleNotFoundError.
          #
          # sentence-transformers and chromadb are deliberately EXCLUDED:
          # they are ~2GB, and the RAG paths degrade gracefully without them
          # (that degradation is now logged as rag_unavailable rather than
          # being silent, so its absence here is visible, not hidden).
          pip install fastapi uvicorn pydantic pyyaml cryptography certifi

      - name: Undefined-name check
        # ast.parse only validates SYNTAX. A NameError from an aliased import
        # (`import time as _time` then `time.sleep()`) only fails at runtime,
        # which is how it reached production once already.
        run: python tools/check_names.py app/*.py

      - name: Regression suite
        run: python tests/test_regression.py

      - name: Diff-engine audit
        # Fails if any engine regains a non-nesting block regex or loses
        # comment stripping.
        run: python tools/audit_diff_engines.py

      - name: Change-type coverage audit
        # Fails if any engine can emit a change_type with no canonical
        # operation. An unclassified type reaches fix_templates as "Unknown
        # change_type", leaves the code unchanged, and therefore opens NO PR --
        # a detected breaking change would produce silence.
        run: python tools/audit_change_types.py

      - name: Coverage matrix
        # Every change_type x every language. Also enforces the per-category
        # contracts: judgment types must produce a marked non-empty diff (an
        # empty diff opens no PR), and wire-only types must leave the code
        # unchanged while saying so explicitly.
        run: python tools/coverage_matrix.py

      - name: Capability registry
        # Fails on any capability claim that has not been earned:
        #   production=true       must satisfy every fact its CATEGORY requires
        #   e2e_tested=true       must name a test that EXISTS and actually RAN
        #
        # Existence alone is too weak -- a test can exist and never execute, or be
        # renamed while the claim points at a stale name. The regression suite
        # writes tests/.last_run.json, and this reads it, so the evidence is the
        # run rather than the reference. Runs AFTER the suite for that reason.
        #
        # Missing evidence is a FAILURE, not a skip: the same rule the registry
        # applies to validation. A gate that passes when it cannot check is the
        # defect the registry exists to remove.
        run: python tools/audit_capabilities.py

      - name: Public claims match the registry
        # landing/index.html said "3 platforms" and "82 tests" while the code had
        # 7 and 96, and changelog.html sat four days stale -- both edited
        # recently, neither read. A number in prose has no owner and no test, so
        # it decays silently.
        #
        # Gates the claims that map 1:1 onto a derived fact (contract types,
        # change types, test count) and requires every LANGUAGE count to say
        # which of four things it means: 15 detected, 11 with a specific consumer
        # matcher, 8-15 with a fix handler, 0 validated. A bare count cannot be
        # corrected to a number, because there is no single right one.
        run: python tools/audit_public_claims.py

      - name: Fail-silent audit (report only)
        # Not gating yet: 51 sites remain, many legitimately silent. Printed
        # so the number is visible in every build and can be ratcheted down.
        continue-on-error: true
        run: python tools/audit_fail_silent.py

      - name: Consumer-matcher vectors
        # The PropBench replay harness (judgment-engine/tools/replay.py) measures
        # this matcher against real merged PRs, but it CANNOT gate CI here: it
        # needs network access, a GitHub token, and a dataset that lives in a
        # different repository. Pretending otherwise would be a gate that never
        # actually runs.
        #
        # What IS gateable is the behaviour the replay exercised. Both vectors
        # must stay live: a symbol query on a package deletion scored 38.5% where
        # the package query scored 90.9% on the same PR, and path locality flags
        # 41/41 package members where symbol search flags 10/41.
        run: |
          python -c "
          from app.smart_consumer_finder import (
              find_field_consumers, find_package_consumers, find_matches_in_file)
          PKG = 'pkg/security/podsecuritypolicy/'
          member = 'pkg/security/podsecuritypolicy/group/mustrunas.go'
          src = 'package group\nfunc mustRunAs() error { return nil }\n'
          assert find_field_consumers(src, member, 'podsecuritypolicy', 'go') == []
          m = find_package_consumers(src, member, PKG, 'go')
          assert len(m) == 1 and m[0].match_type == 'package_member', m
          assert find_matches_in_file(src, member, PKG, 'go', vector='package')
          # The vector must be REACHABLE, not merely implemented. It was once
          # built, unit-tested and CI-gated while unreachable from production.
          from app.change_types import vector_for
          assert vector_for('package_removed') == 'package'
          assert vector_for('field_removed') == 'symbol'
          from app.webhook import _find_removed_specs
          d = _find_removed_specs({'commits': [{'removed': [
              'api/v1/user.proto', 'api/v1/order.proto']}]})
          assert len(d) == 1 and d[0]['change_type'] == 'package_removed', d
          print('consumer-matcher vectors OK (routing + emitter reachable)')
          "

      - name: Language detection is singular
        # There were EIGHT extension->language maps and TWO copies of the
        # scannable-file decision, disagreeing WITH EACH OTHER rather than just
        # drifting: production resolved 5 languages while PropBench's replay
        # harness measured 15, so the published recall figure described a
        # capability the deployed system did not have.
        #
        # The regression suite pins this structurally, but this step states the
        # invariant where it is visible in every build log, because the failure
        # mode is silent -- nothing errors when a module re-adds its own map.
        run: |
          python -c "
          from app import languages
          from app.rag_engine import _detect_language as rag
          from app.consumer_finder import _detect_language as cf
          from app.fix_generator_multi import detect_language as fgm
          from app.multi_step_reasoning import _detect_language as msr
          from app.rag_retriever import _language_from_path as rr
          from app.webhook import _detect_lang as wh, _is_code_file as scan
          for n, f in (('rag_engine', rag), ('consumer_finder', cf),
                       ('fix_generator_multi', fgm), ('multi_step', msr),
                       ('rag_retriever', rr), ('webhook', wh)):
              assert f is languages.detect, n + ' re-forked language detection'
          assert scan is languages.is_scannable, 'webhook re-forked is_scannable'
          # The three extensions that exposed the original disagreements.
          assert languages.detect('a.js') == 'javascript'   # was 'typescript' in one map
          assert languages.detect('a.yaml') == 'yaml'       # 1 of 8 knew it
          assert languages.detect('a.kts') == 'kotlin'      # 2 of 8 knew it
          # Matchers exist for yaml and shell; the file filter used to reject
          # them anyway, which made those matchers unreachable.
          assert languages.is_scannable('hack/up.sh')
          assert languages.is_scannable('deploy/values.yaml')
          assert not languages.is_scannable('api/user.pb.go')   # generated
          assert not languages.is_scannable('node_modules/x.js')  # vendored
          print('language detection OK (%d languages, one map, benchmark == production)'
                % len(languages.languages()))
          "
