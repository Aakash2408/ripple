openapi: 3.0.3
info:
  title: User API
  version: 1.1.0
paths:
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
components:
  schemas:
    User:
      type: object
      required: [id, email, full_name, phone_number]
      properties:
        id:
          type: string
        email:
          type: string
        full_name:
          type: string
        phone_number:
          type: string
          description: E.164, e.g. "+441632960961".
